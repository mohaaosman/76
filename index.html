<!doctype html>
<!--
  data-motion="on" is the posture, declared here and nowhere else in the
  document. It is what makes every --sv-t-enter / --sv-t-count token
  resolve to a duration instead of 0ms: the layer shipped in v0.7 with no
  declaration anywhere, so the plumbing existed and nothing moved.
  It stays a POSTURE rather than a default baked into the tokens, so a
  product installing 76° gets a still system until it says otherwise, and
  prefers-reduced-motion still overrides this attribute completely.
-->
<html lang="en" data-seed="cobalt" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231B1F26'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='800' fill='%23FFFFFF'%3E7%3Ctspan fill='%232C5BE0'%3E6%3C/tspan%3E%3C/text%3E%3C/svg%3E"
    />
    <meta name="description" content="76° — Seventy Six Degrees. The component library. Flat, informational, corporate — paper on a wall." />
    <title>76° UI — Seventy Six Degrees</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/docs/main.tsx"></script>
  </body>
</html>
