# Nixpacks build for Coolify.
# Vite builds the docs site + shadcn registry into dist/; a zero-dependency
# Node static server (server.mjs) serves it. No extra Nix packages — adding
# caddy via nixPkgs collides with the base image's caddy (2.8.4 vs 2.9.0).
# BrowserRouter: server.mjs already rewrites extensionless misses to the app
# shell, so no separate SPA rewrite rule is needed here either.
providers = ['node']

[variables]
# playwright is a devDependency (shipgate screenshots only); the site build
# never uses it, so skip the multi-hundred-MB browser download on npm ci.
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
# Registry cross-references and docs links are baked at build time. Override
# in Coolify if you serve the registry from a different host.
REGISTRY_BASE = 'https://76.zifala.com'

[phases.install]
cmds = ['npm ci']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'node server.mjs'
